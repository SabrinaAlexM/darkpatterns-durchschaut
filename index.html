<style>
:root{
  --paper:#F5F8FC; --grid:#DCE5F1; --ink:#1B2B4B; --ink-soft:#4E5B73; --card:#FFFFFF; --line:#C3CFE0;
  --marker:#FFE14D; --on-marker:#1B2B4B; --red:#D93A26; --blue:#2350C8; --ok:#11805F; --frame:#1B2B4B;
  --c-druck:#D93A26; --c-ersch:#7B45C9; --c-hind:#0E8A6E; --c-irre:#E9A21C; --c-zwang:#2563C9; --chip-text:#FFFFFF;
  --n-a:#FFF2A1; --n-b:#CFEBFF; --n-c:#FFD9E2; --n-d:#D3F4DE;
  --hand:"Gochi Hand","Chalkboard SE","Comic Sans MS",cursive;
  --body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#172530; --grid:#203241; --ink:#EAF0F7; --ink-soft:#A8B6C6; --card:#1F303D; --line:#33495A;
    --marker:#F3D33A; --on-marker:#172530; --red:#FF7462; --blue:#8AAEFF; --ok:#45CFA0; --frame:#0E1820;
    --c-druck:#FF7A66; --c-ersch:#B98FF5; --c-hind:#3FCBA6; --c-irre:#F0AA3C; --c-zwang:#73A6FF; --chip-text:#132029;
    --n-a:#4A4520; --n-b:#1F4058; --n-c:#4D2B36; --n-d:#21483A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#172530; --grid:#203241; --ink:#EAF0F7; --ink-soft:#A8B6C6; --card:#1F303D; --line:#33495A;
  --marker:#F3D33A; --on-marker:#172530; --red:#FF7462; --blue:#8AAEFF; --ok:#45CFA0; --frame:#0E1820;
  --c-druck:#FF7A66; --c-ersch:#B98FF5; --c-hind:#3FCBA6; --c-irre:#F0AA3C; --c-zwang:#73A6FF; --chip-text:#132029;
  --n-a:#4A4520; --n-b:#1F4058; --n-c:#4D2B36; --n-d:#21483A;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
}
img,svg{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
a{color:var(--blue)}
.hand{font-family:var(--hand);font-weight:400}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 90%,transparent 90%);color:inherit}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:2px solid var(--ink)}
.top-in{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:10px 18px;max-width:1040px;margin:0 auto}
.brand{font-family:var(--hand);font-size:1.9rem;line-height:1;background:none;border:0;cursor:pointer;padding:2px 0;color:var(--ink)}
.brand span{background:linear-gradient(transparent 55%,var(--marker) 55%,var(--marker) 92%,transparent 92%)}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-right:auto}
.nav button{background:none;border:0;padding:6px 10px;border-radius:8px;cursor:pointer;font-weight:700;color:var(--ink-soft)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--card);box-shadow:inset 0 -3px 0 var(--marker)}
.nav{align-items:center}
.nav button:not(.nav-main){font-size:.92rem}
.nav .nav-main,.nav .nav-main[aria-current="page"]{background:var(--marker);color:var(--on-marker);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:1.05rem;padding:6px 16px;margin-right:6px}
.nav .nav-main:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.stats{display:flex;gap:8px;align-items:center}
.stat{font-weight:700;padding:4px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--card);cursor:pointer}
.stat.pts{background:var(--marker);color:var(--on-marker);border-color:var(--ink)}

/* Buttons */
.btn{font-weight:700;padding:.65em 1.1em;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);display:inline-flex;align-items:center;gap:.4em;text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--marker);color:var(--on-marker)}
.btn.small{padding:.4em .8em;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--ink-soft);cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}

main{padding:22px 0 60px;outline:none}
h1,h2,h3{line-height:1.2;margin:0 0 .4em}
.h1{font-size:clamp(1.7rem,4vw,2.3rem)}
.lead{font-size:1.15rem;max-width:36em}
.muted{color:var(--ink-soft)}
.chip{display:inline-block;padding:.12em .65em;border-radius:999px;font-weight:700;font-size:.82rem;color:var(--chip-text);background:var(--cat);white-space:nowrap}
.chip.ink{color:#1B2B4B}
.en{font-weight:400;color:var(--ink-soft);font-size:.9em}

/* Start */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;padding-top:20px;padding-bottom:28px}
.hero h1{font-family:var(--hand);font-size:clamp(3.4rem,10vw,6.4rem);line-height:.95;margin:0 0 .2em;transform:rotate(-2deg);transform-origin:left}
.hero h1 span{background:linear-gradient(transparent 60%,var(--marker) 60%,var(--marker) 88%,transparent 88%)}
.demo-pop{position:relative;background:#fff;color:#1d2230;border-radius:16px;padding:22px 20px 26px;box-shadow:6px 6px 0 var(--ink);border:2px solid var(--ink);max-width:340px;margin:0 auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;gap:12px;text-align:center}
.demo-pop b{font-size:1.25rem}
.demo-yes{background:#16a34a;color:#fff;padding:12px;border-radius:10px;font-weight:700}
.demo-no{font-size:.8rem;color:#9aa1ad;position:relative;justify-self:center;padding:4px 6px}
.demo-no::before{content:"";position:absolute;inset:-8px -14px;border:3px solid var(--red);border-radius:55% 45% 52% 48% / 60% 50% 50% 40%;transform:rotate(-3deg);animation:draw .7s .6s both}
.demo-note{position:absolute;right:-18px;bottom:-26px;font-size:2.1rem;color:var(--red);transform:rotate(-8deg);animation:pop .4s 1.2s both}
.pick{padding-bottom:20px}
.pick-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:12px 0 18px}
.level-btn{text-align:left;cursor:pointer;border:2px solid var(--ink);border-radius:14px;padding:16px 18px;background:var(--card);box-shadow:4px 4px 0 var(--ink);display:grid;gap:4px}
.level-btn .hand{font-size:2rem;line-height:1}
.level-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

/* Hub */
.stations{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin:22px 0}
.note{border:0;text-align:left;cursor:pointer;padding:20px 18px 18px;min-height:190px;display:flex;flex-direction:column;gap:6px;color:var(--ink);box-shadow:2px 6px 0 rgba(27,43,75,.18);position:relative}
.note:nth-child(1){background:var(--n-a);transform:rotate(-1.4deg)}
.note:nth-child(2){background:var(--n-b);transform:rotate(1deg)}
.note:nth-child(3){background:var(--n-c);transform:rotate(-.6deg)}
.note:nth-child(4){background:var(--n-d);transform:rotate(1.5deg)}
.note:hover{transform:rotate(0) translateY(-2px)}
.note .hand{font-size:2.1rem;line-height:1}
.note .prog{margin-top:auto;font-weight:700}
.note .emoji{font-size:1.8rem}
.tape{position:absolute;top:-10px;left:50%;width:70px;height:20px;margin-left:-35px;background:rgba(255,255,255,.55);transform:rotate(-3deg)}

/* Pickers */
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.pick-item{text-align:left;border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:14px 16px;cursor:pointer;display:grid;gap:4px;box-shadow:3px 3px 0 var(--ink)}
.pick-item .done{color:var(--ok);font-weight:700}
.crumbs{margin-bottom:10px}

/* Game layout */
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
.side{position:sticky;top:90px;display:grid;gap:12px}
.side h2{font-size:1.5rem}
.mission{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:12px 14px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:30px;height:30px;border-radius:50%;border:2px dashed var(--ink-soft);display:grid;place-items:center;font-weight:700}
.dot.on{border:2px solid var(--red);background:var(--red);color:var(--chip-text)}
.hint{font-family:var(--hand);font-size:1.35rem;color:var(--red);margin:0;min-height:1.2em}
.phone-wrap{position:relative;order:2}
.phone{width:min(370px,100%);margin:0 auto;border:11px solid var(--frame);border-radius:36px;background:#fff;overflow:hidden;box-shadow:7px 7px 0 var(--marker)}
.screen{height:min(640px,78vh);overflow-y:auto;position:relative;background:#fff;color:#16181d}
.side{order:1}

/* Hotspots */
.hs{background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;position:relative;display:block;width:100%;font:inherit;color:inherit}
.hs.caught::before{content:"";position:absolute;inset:-5px -6px;border:3px solid var(--red);border-radius:50% 46% 54% 44% / 55% 48% 52% 45%;pointer-events:none;animation:draw .45s both;z-index:2}
.hs.caught::after{content:attr(data-tag);position:absolute;top:-14px;right:4px;font-family:var(--hand);font-size:1.05rem;line-height:1.1;background:#FFE14D;color:#1B2B4B;padding:1px 8px;transform:rotate(-4deg);pointer-events:none;z-index:3;white-space:normal;max-width:85%;text-align:right;box-shadow:1px 1px 0 rgba(0,0,0,.25)}
.hs.miss{animation:shake .35s}
@keyframes draw{from{clip-path:inset(0 100% 0 0);opacity:.3}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* Stamp */
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.stamp span{font-family:var(--hand);font-size:3rem;color:var(--red);border:5px solid var(--red);border-radius:14px;padding:4px 18px;background:rgba(255,255,255,.85);transform:rotate(-12deg);animation:stamp .5s cubic-bezier(.2,1.6,.5,1) both}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(10,18,30,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet-card{background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);width:min(520px,100%);max-height:85vh;overflow-y:auto;padding:20px 20px 18px;display:grid;gap:10px;animation:up .25s ease-out}
@media (min-width:700px){.sheet{align-items:center}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-card h3{font-size:1.35rem;margin:0}
.tip{background:var(--n-d);border-radius:10px;padding:10px 12px;color:var(--ink)}
.tip b{display:block}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--card);cursor:pointer;font-weight:700}
.opt.right{background:var(--ok);color:var(--chip-text);border-color:var(--ok)}
.opt.wrong{background:var(--red);color:var(--chip-text);border-color:var(--red)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.verdict{font-family:var(--hand);font-size:1.8rem;line-height:1}
.verdict.good{color:var(--ok)} .verdict.bad{color:var(--red)}

/* Toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;display:grid;gap:8px;justify-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:700;animation:up .25s ease-out}
.toast.badge{background:var(--marker);color:var(--on-marker);border:2px solid var(--ink)}

/* Sort */
.sort-card{background:var(--n-a);color:var(--ink);padding:26px 22px;font-size:1.2rem;box-shadow:2px 6px 0 rgba(27,43,75,.18);transform:rotate(-.8deg);margin:14px 0 20px;max-width:640px;position:relative}
.sort-card .hand{font-size:1.4rem;color:var(--ink-soft);display:block}
.catbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;max-width:760px}
.catbtn{border:2px solid var(--ink);border-left:12px solid var(--cat);border-radius:10px;background:var(--card);padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:2px}
.catbtn small{color:var(--ink-soft);font-weight:400}
.catbtn b{font-size:1.05rem}
.catbtn.right{outline:4px solid var(--ok)} .catbtn.wrong{outline:4px solid var(--red)}
.progressbar{height:10px;background:var(--card);border:2px solid var(--ink);border-radius:99px;overflow:hidden;max-width:640px}
.progressbar i{display:block;height:100%;background:var(--marker)}

/* Album */
.cat-sec{margin:26px 0}
.cat-sec h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cat-sec h2 .bar{width:16px;height:28px;background:var(--cat);border-radius:4px}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sticker{text-align:left;cursor:pointer;border:2px dashed var(--line);border-radius:14px;background:transparent;padding:12px 14px;display:grid;gap:4px;min-height:96px}
.sticker .st{font-size:.8rem;color:var(--ink-soft)}
.sticker.got{border:2px solid var(--ink);background:var(--card);box-shadow:3px 3px 0 var(--cat)}
.sticker.got .st{color:var(--ok);font-weight:700}

/* Badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-top:16px}
.badge{border:2px solid var(--ink);border-radius:16px;background:var(--card);padding:16px;display:grid;gap:4px;justify-items:start}
.badge .ic{font-size:2.4rem;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--marker);border:3px solid var(--ink)}
.badge.locked{opacity:.55;border-style:dashed}
.badge.locked .ic{filter:grayscale(1);background:var(--paper)}

/* Teacher */
.tabs{display:flex;gap:8px;margin:10px 0 18px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tabs button{background:none;border:2px solid transparent;border-bottom:0;border-radius:10px 10px 0 0;padding:8px 16px;font-weight:700;cursor:pointer;color:var(--ink-soft);margin-bottom:-2px}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);border-color:var(--ink);box-shadow:inset 0 3px 0 var(--marker)}
.tabn{font-weight:400;font-size:.85em;color:var(--ink-soft)}
.prose{max-width:44em}
.prose h2{margin-top:1.4em}
.prose ul{padding-left:1.2em}
.prose li{margin:.3em 0}
footer{border-top:2px solid var(--ink);padding:18px 0 30px;font-size:.92rem;color:var(--ink-soft)}
footer .row{margin-top:8px}
.field{display:grid;gap:4px;font-weight:700;margin:10px 0;max-width:560px}
.field input,.field textarea{font:inherit;font-weight:400;padding:10px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.field textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;word-break:break-all}
.summary{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px 16px;max-width:640px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.summary dt{font-weight:700}
.summary dd{margin:0}
.addr{font-style:normal}

/* ===== Fake apps (eigene, feste Farben wie echte Screenshots) ===== */
.app{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.35;min-height:100%;color:#16181d;background:#fff}
/* KickZ */
.kick .k-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #eee}
.kick .k-logo{font-weight:900;letter-spacing:2px;font-size:18px;width:auto}
.kick .k-img{background:#f1f0ec;padding:20px 26px}
.kick .k-pad{padding:14px 16px 20px;display:grid;gap:10px}
.kick .k-name{font-size:20px;margin:0}
.kick .k-price{font-size:22px;font-weight:800}
.kick .k-timer{background:#e11d48;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700}
.kick .k-scarce{color:#c2410c;font-weight:700}
.kick .k-watch{color:#555;font-size:13px}
.kick .k-size{border:1px solid #bbb;border-radius:8px;padding:10px}
.kick .k-cta{background:#111;color:#fff;text-align:center;border-radius:10px;padding:14px;font-weight:700}
.kick .k-more{font-weight:700;margin-top:6px}
.kick .k-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kick .k-tile{background:#f6f6f4;border-radius:10px;padding:10px;font-size:13px}
.kick .k-ti{display:block;font-size:34px;text-align:center;background:#ecebe6;border-radius:8px;margin-bottom:6px}
.kick .k-anz{display:block;font-size:9px;color:#aaa;text-align:right;margin-top:2px}
/* Pixel Arena */
.pix{background:#221443;color:#f5f0ff;padding-bottom:20px}
.pix .px-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#170c33}
.pix .px-lv,.pix .px-gems{width:auto;font-weight:800}
.pix .px-xp{display:inline-block;width:60px;height:8px;background:#3d2c70;border-radius:9px;vertical-align:middle;margin-left:6px;overflow:hidden}
.pix .px-xp i{display:block;width:65%;height:100%;background:#7cf}
.pix .px-nag{margin:12px 14px 0;width:calc(100% - 28px);background:#ffcf33;color:#2a1a00;border-radius:10px;padding:10px 12px;font-weight:700}
.pix .px-h{padding:16px 14px 6px;font-weight:800;color:#b9a9ff;font-size:13px;letter-spacing:.04em}
.pix .px-skin{display:flex;gap:12px;align-items:center;margin:0 14px;background:#33206a;border-radius:12px;padding:12px}

/* Escape: StreamBox */
.sbx{background:#111318;color:#f2f2f2;min-height:640px}
.sbx .sb-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.sbx .sb-logo{color:#ff3b3b;font-weight:900;font-size:20px}
.sbx .sb-av{width:34px;height:34px;border-radius:8px;background:#3b82f6;border:0;cursor:pointer;color:#fff;font-weight:800}
.sbx .sb-hero{margin:4px 16px;height:170px;border-radius:14px;background:linear-gradient(135deg,#7c3aed,#ef4444);display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.sbx .sb-play{background:#fff;color:#111;border:0;border-radius:8px;padding:10px;font-weight:800;margin-top:8px;cursor:pointer}
.sbx .sb-h{padding:16px 16px 6px;font-weight:700}
.sbx .sb-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px}
.sbx .sb-tiles button{height:90px;border-radius:8px;border:0;cursor:pointer;color:#fff;font-weight:700;font-size:12px}
.sbx .sb-list{display:grid;padding:6px 16px}
.sbx .sb-item{background:none;border:0;border-bottom:1px solid #262a33;color:#e8e8e8;text-align:left;padding:14px 4px;cursor:pointer;font-size:15px}
.sbx .sb-up{background:linear-gradient(90deg,#f59e0b,#ef4444);border:0;border-radius:12px;color:#fff;font-weight:800;padding:16px;margin:6px 0 10px;cursor:pointer;font-size:16px}
.sbx .sb-tiny{background:none;border:0;color:#4b5060;font-size:10px;cursor:pointer;padding:24px 4px 10px;text-align:left}
.sbx .sb-center{padding:30px 20px;display:grid;gap:12px;text-align:center}
.sbx .sb-center h4{font-size:20px;margin:0}
.sbx .sb-big{background:#ff3b3b;color:#fff;border:0;border-radius:12px;padding:15px;font-weight:800;font-size:16px;cursor:pointer}
.sbx .sb-small{background:none;border:0;color:#6b7080;font-size:11px;cursor:pointer;padding:6px}
.sbx .sb-radio{display:flex;gap:10px;align-items:center;background:#1c1f27;border:1px solid #2c3140;border-radius:10px;padding:12px;cursor:pointer;color:#eee;text-align:left}
.sbx .sb-radio.sel{border-color:#ff3b3b}
.sbx .sb-radio i{width:16px;height:16px;border-radius:50%;border:2px solid #888;flex:0 0 16px}
.sbx .sb-radio.sel i{background:#ff3b3b;border-color:#ff3b3b}
.sbx .sb-confirm{background:#2a2e38;color:#ddd;border:0;border-radius:10px;padding:12px;cursor:pointer;font-weight:700}
.sbx .sb-confirm:disabled{opacity:.4;cursor:not-allowed}
/* Escape: Blabla */
.bla{background:#eef5ef;min-height:640px;position:relative}
.bla .bl-top{background:#1f9d55;color:#fff;padding:14px 16px;font-weight:800}
.bla .bl-chat{padding:10px 16px;display:grid;gap:10px;filter:blur(2px)}
.bla .bl-chat div{background:#fff;border-radius:12px;padding:12px}
.bl-modal{position:absolute;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;padding:20px}
.bl-box{background:#fff;border-radius:16px;padding:20px;display:grid;gap:10px;text-align:center}
.bl-box h4{margin:0;font-size:17px}
.bl-box p{margin:0;font-size:13px;color:#444;text-align:left}
.bl-box ul{text-align:left;font-size:13px;color:#333;padding-left:18px;margin:0}
.bl-agree{background:#1f9d55;color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;font-size:15px}
.bl-no{background:#fff;color:#555;border:1px solid #ccc;border-radius:12px;padding:10px;cursor:pointer}
.bl-link{background:none;border:0;color:#1f6f45;text-decoration:underline;cursor:pointer;font-size:13px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr}
  .game{grid-template-columns:1fr}
  .side{position:static}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const BADGES = [
 {id:'druck',ic:'⏳',name:'Kein Stress!',desc:'Alle 5 Tricks der Kategorie Druckausübung entdeckt.'},
 {id:'ersch',ic:'🕵️',name:'Nichts untergejubelt',desc:'Alle 3 Tricks der Kategorie Erschleichung entdeckt.'},
 {id:'hind',ic:'🧗',name:'Hindernislauf',desc:'Alle 5 Tricks der Kategorie Hindernisse entdeckt.'},
 {id:'irre',ic:'🔍',name:'Nicht reingelegt',desc:'Alle 4 Tricks der Kategorie Irreführung entdeckt.'},
 {id:'zwang',ic:'🗝️',name:'Echte Wahl',desc:'Alle 3 Tricks der Kategorie Operativer Zwang entdeckt.'},
 {id:'spot',ic:'🎯',name:'Trickjäger:in',desc:'Alle 6 Apps der Trickjagd geschafft.'},
 {id:'escape',ic:'🚪',name:'Ausbrecher:in',desc:'Alle Missionen bei «Entkommen» geschafft.'},
 {id:'sort',ic:'🗂️',name:'Zuordnungsprofi',desc:'Bei «Zuordnen» mindestens 8 von 10 richtig.'},
 {id:'all',ic:'🌟',name:'Voller Durchblick',desc:'Alle 20 Tricks im Sammelalbum.'}
];

/* ============ Zustand ============ */
const KEY='durchschaut-v1';
function load(){const d={level:null,points:0,disc:[],caught:[],scenes:[],escapes:[],sortBest:0,badges:[],st:{},prog:{},escSt:{},sortRun:null};try{const r=localStorage.getItem(KEY);if(r)Object.assign(d,JSON.parse(r));}catch(e){}return d;}
const S=load();
function setSt(id,ok){S.st=S.st||{};S.st[id]=ok?'ok':'unsure';save();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const lvl=()=>S.level||1;
const $=s=>document.querySelector(s);
const main=$('#main');
let timers=[];
function clearTimers(){timers.forEach(clearInterval);timers=[];}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const chip=c=>`<span class="chip${c==='irre'?' ink':''}" style="--cat:var(--c-${c})">${CATS[c].name}</span>`;
const pname=p=>lvl()===2?`${p.de} <span class="en">(${p.en})</span>`:p.de;
const pexp=p=>lvl()===1?p.n1:p.n2;

function toast(msg,cls=''){const t=document.createElement('div');t.className='toast '+cls;t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),cls?3200:1600);}
function addPoints(n){if(!n)return;S.points=Math.max(0,S.points+n);save();updateHeader();toast((n>0?'+':'')+n+' Punkte');}
function discover(id){if(!S.disc.includes(id)){S.disc.push(id);save();checkBadges();}}
function checkBadges(){
  const cond={
    spot:()=>S.scenes.length>=SCENES.length,
    escape:()=>S.escapes.length>=MISSIONS.length,
    sort:()=>S.sortBest>=8,
    all:()=>PATTERNS.every(p=>S.disc.includes(p.id))
  };
  BADGES.forEach(b=>{
    if(S.badges.includes(b.id))return;
    const ok=CATS[b.id]?PATTERNS.filter(p=>p.cat===b.id).every(p=>S.disc.includes(p.id)):cond[b.id]();
    if(ok){S.badges.push(b.id);save();toast(`${b.ic} Abzeichen: ${b.name}`,'badge');}
  });
  updateHeader();
}
function updateHeader(){
  $('#pts').textContent='⭐ '+S.points;
  $('#lvlBtn').textContent=S.level===2?'Niveau: Profi':S.level===1?'Niveau: Einstieg':'Niveau';
}

/* ============ Sheet ============ */
const sheet=$('#sheet'), sheetCard=$('#sheetCard');
let sheetClose=null;
function openSheet(html,onClick,onClose){sheetCard.innerHTML=html;sheet.hidden=false;sheet.onclick=e=>{if(e.target===sheet){closeSheet();return;}onClick&&onClick(e);};sheetClose=onClose||null;const f=sheetCard.querySelector('button');f&&f.focus();}
function closeSheet(){if(sheet.hidden)return;sheet.hidden=true;sheetCard.innerHTML='';const c=sheetClose;sheetClose=null;c&&c();}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function patternInfo(p,head=''){
  return `${head}<div class="row">${chip(p.cat)}</div><h3 id="sheetTitle">${pname(p)}</h3><p style="margin:0">${pexp(p)}</p><div class="tip"><b>So durchschaust du es</b>${p.tip}</div>`;
}

/* ============ Routing ============ */
const VIEWS={};
function go(v,arg){
  if(!S.level && !['start','teach','imprint','save'].includes(v)) v='start';
  clearTimers();sheetClose=null;closeSheet();main.onclick=null;
  VIEWS[v](arg);
  window.scrollTo(0,0);main.focus({preventScroll:true});
  document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v?'page':'false'));
}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!sheet.contains(g)){e.preventDefault();go(g.dataset.go,g.dataset.arg);}});
$('#lvlBtn').onclick=()=>{
  openSheet(`<h3 id="sheetTitle">Niveau wählen</h3>
  <div class="opts"><button class="opt" data-l="1">Einstieg: einfache Sprache, Tipps und Fehlklicks kosten keine Punkte</button><button class="opt" data-l="2">Profi: Fachbegriffe, Tricks selbst benennen, Tipps und Fehlklicks kosten Punkte</button></div>`,
  e=>{const b=e.target.closest('[data-l]');if(b){S.level=Number(b.dataset.l);save();updateHeader();closeSheet();go('hub');}});
};

/* ============ Start ============ */
VIEWS.start=()=>{
  main.innerHTML=`<section class="wrap hero">
   <div>
    <h1><span>Durchschaut!</span></h1>
    <p class="lead">Apps und Webseiten tricksen. Mit Countdowns, versteckten Häkchen und gemeinen Nein-Knöpfen. Hier lernst du die 20 häufigsten Tricks kennen und entlarvst sie selbst.</p>
   </div>
   <div aria-hidden="true">
    <div class="demo-pop"><b>Nur heute: 20 % Rabatt!</b><span class="demo-yes">Jetzt sparen</span><span class="demo-no">Nein danke, ich zahle gern zu viel</span><span class="demo-note hand">Trick!</span></div>
   </div>
  </section>
  <section class="wrap pick">
   <h2>Wie willst du spielen?</h2>
   <div class="pick-row">
    <button class="level-btn" data-level="1"><span class="hand">Einstieg</span><span>Einfache Sprache. Du kannst Tipps holen, ohne Punkte zu verlieren.</span></button>
    <button class="level-btn" data-level="2"><span class="hand">Profi</span><span>Mit Fachbegriffen. Du benennst die Tricks selbst und holst Extrapunkte. Tipps und Fehlklicks kosten Punkte.</span></button>

   <p class="muted">Du kannst das Niveau oben jederzeit wechseln. Lehrpersonen finden Hinweise unter <button class="linkbtn" data-go="teach">Für Lehrpersonen</button>.</p>
  </section>`;
  main.onclick=e=>{const b=e.target.closest('[data-level]');if(b){S.level=Number(b.dataset.level);save();updateHeader();go('hub');}};
};

/* ============ Hub ============ */
VIEWS.hub=()=>{
  main.innerHTML=`<section class="wrap">
   <h1 class="h1">Wähle eine Station</h1>
   <p class="lead">Jeder Trick, den du entlarvst, landet im Sammelalbum. Bis jetzt hast du <b>${S.disc.length} von 20</b>.</p>
   <div class="stations">
    <button class="note" data-go="spot"><span class="tape"></span><span class="emoji">🎯</span><span class="hand">Trickjagd</span><span>Sechs erfundene Apps. Tippe auf alles, was dich austricksen will.</span><span class="prog">${S.scenes.length} von ${SCENES.length} Apps geschafft</span></button>
    <button class="note" data-go="escape"><span class="tape"></span><span class="emoji">🚪</span><span class="hand">Entkommen</span><span>Cookies ablehnen, ein Abo kündigen, Nein sagen. Klingt einfach?</span><span class="prog">${S.escapes.length} von ${MISSIONS.length} Missionen geschafft</span></button>
    <button class="note" data-go="sort"><span class="tape"></span><span class="emoji">🗂️</span><span class="hand">Zuordnen</span><span>Zehn Beispiele aus dem Alltag. Welcher Trick steckt dahinter?</span><span class="prog">Bestes Ergebnis: ${S.sortBest} von 10</span></button>
   </div>
  </section>`;
};

/* ============ Trickjagd ============ */
const pidsOf=(sc,id)=>[].concat(sc.tricks[id]||[]).map(x=>P[x]);
const tagOf=ps=>ps.map(p=>p.de).join(' + ');
const multiInfo=(ps,head='')=>head+ps.map(p=>patternInfo(p)).join('<hr style="border:0;border-top:2px dashed var(--line);width:100%;margin:6px 0">');
const closeRow='<div class="row"><button class="btn" data-close>Schliessen</button></div>';
const onClose=e=>{if(e.target.closest('[data-close]'))closeSheet();};
VIEWS.spot=(arg)=>{
  if(arg===undefined){
    main.innerHTML=`<section class="wrap"><div class="crumbs"><button class="linkbtn" data-go="hub">‹ Stationen</button></div>
    <h1 class="h1">Trickjagd</h1><p class="lead">In jeder App verstecken sich 4 verdächtige Stellen. Tippe auf alles, was dir komisch vorkommt. In der letzten App stecken manchmal mehrere Tricks in einer Stelle.</p>
    <div class="picker">${SCENES.map((s,i)=>`<button class="pick-item" data-go="spot" data-arg="${i}"><b>App ${i+1}: ${s.title}</b><span class="muted">${s.intro}</span>${S.scenes.includes(i)?'<span class="done">✔ geschafft</span>':''}</button>`).join('')}</div></section>`;
    return;
  }
  const i=Number(arg), sc=SCENES[i], ids=Object.keys(sc.tricks), found=new Set();
  main.innerHTML=`<section class="wrap"><div class="crumbs"><button class="linkbtn" data-go="spot">‹ Alle Apps</button></div>
   <div class="game">
    <div class="phone-wrap"><div class="phone"><div class="screen" id="scr">${sc.html}</div></div></div>
    <aside class="side">
     <h2>App ${i+1}: ${sc.title}</h2>
     <div class="mission">${sc.intro} <b>${sc.goal||'Finde die 4 Tricks!'}</b></div>
     <div class="dots" id="dots">${ids.map(()=>'<span class="dot"></span>').join('')}</div>
     <div class="row"><button class="btn small" id="hintBtn">💡 Tipp${lvl()===2?' (−3)':''}</button><button class="btn small" id="solveBtn">🔎 Auflösen</button><button class="btn small" id="againBtn">↺ Neu starten</button></div>
     <p class="hint" id="hint"></p>
     <div id="after"></div>
    </aside>
   </div></section>`;
  const scr=$('#scr');
  sc.init&&sc.init(scr);
  const refreshDots=()=>{document.querySelectorAll('#dots .dot').forEach((d,k)=>{const on=k<found.size;d.classList.toggle('on',on);d.textContent=on?'✓':'';});};
  S.prog=S.prog||{};
  const keep=()=>{S.prog[i]=[...found];save();};
  const finish=(quiet)=>{
    const first=!S.scenes.includes(i);
    if(first){S.scenes.push(i);save();}
    if(!quiet)stamp($('.phone-wrap'));
    $('#hint').textContent='';
    $('#after').innerHTML=`<div class="mission"><b>Alle verdächtigen Stellen gefunden!</b> ${first?'':'(Wiederholung)'}</div>
     <div class="row">${i<SCENES.length-1?`<button class="btn primary" data-go="spot" data-arg="${i+1}">Nächste App</button>`:`<button class="btn primary" data-go="escape">Weiter zu «Entkommen»</button>`}<button class="btn" data-replay="${i}">↺ Nochmals spielen</button></div>`;
    checkBadges();
  };
  const reveal=(id,el,ps,head='',okIds=null)=>{
    found.add(id);el.classList.add('caught');el.dataset.tag=tagOf(ps);refreshDots();keep();
    const key='s'+i+':'+id;
    if(!S.caught.includes(key)){S.caught.push(key);save();addPoints(10*ps.length);}
    ps.forEach(p=>{discover(p.id);setSt(p.id,!okIds||okIds.includes(p.id));});
    const link=ps.length===1?`<a class="linkbtn" href="${ps[0].url}" target="_blank" rel="noopener">Echte Beispiele auf da-pa.ch</a>`:'';
    openSheet(multiInfo(ps,head)+`<div class="row"><button class="btn primary" data-close>${found.size<ids.length?'Weiter suchen':'Fertig'}</button>${link}</div>`,
      onClose,()=>{if(found.size===ids.length)finish();});
  };
  const bonus=(id,ok)=>{const key='q'+i+':'+id;if(ok&&!S.caught.includes(key)){S.caught.push(key);save();addPoints(5);}};
  scr.onclick=e=>{
    const el=e.target.closest('.hs');if(!el)return;
    const id=el.dataset.hs;
    sc.onTap&&sc.onTap(id,scr);
    const ps=pidsOf(sc,id);
    if(!ps.length){
      el.classList.remove('miss');void el.offsetWidth;el.classList.add('miss');
      if(lvl()===2)addPoints(-2);
      openSheet(`<div class="verdict bad">Kein Trick</div><p id="sheetTitle" style="margin:0">${sc.harmless[id]||'Das ist harmlos.'}</p><div class="row"><button class="btn" data-close>Weiter suchen</button></div>`,onClose);
      return;
    }
    if(found.has(id)){openSheet(multiInfo(ps)+closeRow,onClose);return;}
    const multi=ps.length>1;
    if(lvl()===1){reveal(id,el,ps,'<div class="verdict good">Erwischt!</div>'+(multi?`<p style="margin:0"><b>Gleich ${ps.length} Tricks auf einmal!</b></p>`:''));return;}
    const opts=shuffle([...ps,...shuffle(PATTERNS.filter(x=>!ps.includes(x))).slice(0,3)]);
    const optHtml=opts.map(o=>`<button class="opt" data-o="${o.id}" aria-pressed="false">${o.de} <span class="en">(${o.en})</span></button>`).join('');
    if(!multi){
      openSheet(`<div class="verdict good">Treffer!</div><h3 id="sheetTitle">Welcher Trick ist das?</h3><div class="opts">${optHtml}</div>`,
        e2=>{const b=e2.target.closest('[data-o]');if(!b)return;const ok=b.dataset.o===ps[0].id;bonus(id,ok);
          sheet.hidden=true;reveal(id,el,ps,ok?'<div class="verdict good">Richtig benannt! +5</div>':'<div class="verdict bad">Fast. Es ist dieser Trick:</div>',ok?null:[]);});
    } else {
      openSheet(`<div class="verdict good">Treffer!</div><h3 id="sheetTitle">Welche Tricks stecken hier drin?</h3><p class="muted" style="margin:0">Mehrere Antworten sind richtig. Tippe alle an, dann auf «Prüfen».</p><div class="opts">${optHtml}</div><div class="row"><button class="btn primary" data-check>Prüfen</button></div>`,
        e2=>{const b=e2.target.closest('[data-o]');
          if(b){const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',String(on));b.classList.toggle('picked',on);return;}
          if(!e2.target.closest('[data-check]'))return;
          const picked=[...sheetCard.querySelectorAll('[data-o][aria-pressed="true"]')].map(x=>x.dataset.o);
          const hits=ps.filter(p=>picked.includes(p.id)).length, ok=hits===ps.length&&picked.length===ps.length;
          bonus(id,ok);sheet.hidden=true;
          reveal(id,el,ps,ok?'<div class="verdict good">Alle richtig! +5</div>':`<div class="verdict bad">${hits} von ${ps.length} erkannt${picked.length>hits?', dazu falsche angetippt':''}. Hier steckt drin:</div>`,ps.filter(p=>picked.includes(p.id)).map(p=>p.id));});
    }
  };
  $('#hintBtn').onclick=()=>{
    const next=ids.find(x=>!found.has(x));if(!next)return;
    if(lvl()===2){if(S.points<3){toast('Zu wenig Punkte für einen Tipp');return;}addPoints(-3);}
    $('#hint').textContent=sc.hints[next];
  };
  $('#againBtn').onclick=()=>replayScene(i);
  (S.prog[i]||[]).forEach(id=>{const el=scr.querySelector(`[data-hs="${id}"]`);if(!el||!sc.tricks[id])return;found.add(id);el.classList.add('caught');el.dataset.tag=tagOf(pidsOf(sc,id));sc.onTap&&sc.onTap(id,scr);});
  refreshDots();
  if(found.size===ids.length)finish(true);
  $('#solveBtn').onclick=()=>{
    const left=ids.filter(x=>!found.has(x));if(!left.length)return;
    const all=[];
    left.forEach(id=>{const el=scr.querySelector(`[data-hs="${id}"]`),ps=pidsOf(sc,id);found.add(id);el.classList.add('caught');el.dataset.tag=tagOf(ps);ps.forEach(p=>{discover(p.id);setSt(p.id,false);all.push(p);});});
    refreshDots();keep();$('#hint').textContent='';
    $('#after').innerHTML=`<div class="mission"><b>Aufgelöst.</b> Diese Tricks hast du nicht gefunden (dafür gibt es keine Punkte):</div><div class="opts">${all.map(p=>`<button class="opt" data-pi="${p.id}">${chip(p.cat)} ${pname(p)}</button>`).join('')}</div><div class="row"><button class="btn primary" data-replay="${i}">↺ Nochmals versuchen</button>${i<SCENES.length-1?`<button class="btn" data-go="spot" data-arg="${i+1}">Nächste App</button>`:''}</div>`;
    $('#after').onclick=e=>{const pb=e.target.closest('[data-pi]');if(pb)openSheet(patternInfo(P[pb.dataset.pi])+closeRow,onClose);};
  };
};

 {id:'contest',g:'want',title:'Gewinnspiel',goal:'Bei «SoundDrop» kannst du kabellose Kopfhörer gewinnen. Ziel: Mach mit, aber ohne Werbung, ohne Datenweitergabe und ohne Spam.',

VIEWS.escape=(arg)=>{
  if(arg===undefined){
    main.innerHTML=`<section class="wrap"><div class="crumbs"><button class="linkbtn" data-go="hub">‹ Stationen</button></div>
    <h1 class="h1">Entkommen</h1><p class="lead">Sieben Missionen, die eigentlich ganz einfach sein sollten. Achtung: Die Apps wollen dich aufhalten.</p>
    ${[['no','Nein sagen','Ablehnen, kündigen, abmelden. Klingt einfach?'],['want','Etwas haben wollen','Weiterchatten, herunterladen, gewinnen. Ohne reinzufallen.']].map(([g,t,d])=>`<h2 style="margin:22px 0 0">${t}</h2><p class="muted" style="margin:2px 0 0">${d}</p>
    <div class="picker">${MISSIONS.map((m,i)=>m.g!==g?'':`<button class="pick-item" data-go="escape" data-arg="${i}"><b>${m.title}</b><span class="muted">${m.goal}</span>${S.escapes.includes(m.id)?'<span class="done">✔ geschafft</span>':''}</button>`).join('')}</div>`).join('')}</section>`;
    return;
  }
  const i=Number(arg), m=MISSIONS[i];
  S.escSt=S.escSt||{};
  const saved=S.escSt[m.id];
  let st=saved&&saved.st?saved.st:Object.assign(m.init(),{clicks:0}), over=!!(saved&&saved.over);
  const keepE=()=>{S.escSt[m.id]={st,over};save();};
  main.innerHTML=`<section class="wrap"><div class="crumbs"><button class="linkbtn" data-go="escape">‹ Alle Missionen</button></div>
   <div class="game">
    <div class="phone-wrap"><div class="phone"><div class="screen" id="scr"></div></div></div>
    <aside class="side">
     <h2>Mission: ${m.title}</h2>
     <div class="mission">${m.goal}</div>
     <p class="muted" style="margin:0">Klicks: <b id="clicks">0</b></p>
     <div class="row"><button class="btn small" id="restart">↺ Neu starten</button></div>
     <div id="after"></div>
    </aside>
   </div></section>`;
  const scr=$('#scr');
  const draw=()=>{scr.innerHTML=m.render(st);$('#clicks').textContent=st.clicks;keepE();};
  const restart=()=>{st=Object.assign(m.init(),{clicks:0});over=false;$('#after').innerHTML='';draw();};
  $('#restart').onclick=restart;
  const showDone=()=>{
      $('#after').innerHTML=`<div class="mission">${m.doneText(st)}</div>
       <p style="margin:4px 0 0"><b>Diese Tricks haben dich aufgehalten:</b></p>
       <div class="opts">${m.patterns.map(id=>`<button class="opt" data-pi="${id}">${chip(P[id].cat)} ${pname(P[id])}</button>`).join('')}</div>
       <div class="row">${i<MISSIONS.length-1?`<button class="btn primary" data-go="escape" data-arg="${i+1}">Nächste Mission</button>`:`<button class="btn primary" data-go="sort">Weiter zu «Zuordnen»</button>`}<button class="btn" id="again2">↺ Nochmals spielen</button></div>`;
      $('#again2').onclick=restart;
      $('#after').onclick=e2=>{const pb=e2.target.closest('[data-pi]');if(pb)openSheet(patternInfo(P[pb.dataset.pi])+'<div class="row"><button class="btn" data-close>Schliessen</button></div>',e3=>{if(e3.target.closest('[data-close]'))closeSheet();});};
  };
  draw();
  if(over)showDone();
  scr.onclick=e=>{
    if(over)return;
    const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
    st.clicks++;
    const r=m.act(st,b.dataset.act);
    if(r&&r.trap){
      if(lvl()===2)addPoints(-5);
      openSheet(`<div class="verdict bad">Reingefallen!</div><p id="sheetTitle" style="margin:0">${r.trap}</p><div class="row"><button class="btn primary" data-close>Nochmals versuchen</button></div>`,e2=>{if(e2.target.closest('[data-close]'))closeSheet();},restart);
      return;
    }
    if(r&&r.note){draw();toast(r.note);return;}
    if(r&&r.done){
      over=true;draw();
      const first=!S.escapes.includes(m.id);
      if(first){S.escapes.push(m.id);save();addPoints(30);}
      m.patterns.forEach(id=>{discover(id);setSt(id,true);});
      stamp($('.phone-wrap'),'Geschafft!');
      showDone();
      checkBadges();
      return;
    }
    draw();
  };
};

/* ============ Zuordnen ============ */
VIEWS.sort=(arg)=>{
  let run=S.sortRun;
  if(Array.isArray(arg)||!run||!Array.isArray(run.deck)||run.k>=run.deck.length){
    run={deck:Array.isArray(arg)?arg:shuffle(Object.keys(SORTCARDS)).slice(0,10),k:0,score:0,wrong:[]};
    S.sortRun=run;save();
  }
  const deck=run.deck.filter(x=>SORTCARDS[x]),n=deck.length,wrong=run.wrong;
  let k=run.k,score=run.score;
  const renderCard=()=>{
    if(k>=deck.length){
      const best=n===10&&score>S.sortBest; if(best){S.sortBest=score;}
      S.sortRun=null;save();
      checkBadges();
      main.innerHTML=`<section class="wrap"><div class="crumbs"><button class="linkbtn" data-go="hub">‹ Stationen</button></div>
       <h1 class="h1">${score} von ${n} richtig</h1>
       <p class="lead">${score>=8?'Starker Durchblick!':score>=5?'Gut! Mit dem Sammelalbum wird es noch besser.':'Schau dir die Tricks im Sammelalbum an und versuch es nochmals.'}${best?' Neuer Bestwert!':''}</p>
       <div class="row"><button class="btn primary" data-go="sort">Neue Runde</button>${wrong.length?'<button class="btn" id="practice">Fehler nochmals üben</button>':''}<button class="btn" data-go="album">Sammelalbum</button></div></section>`;
      const pr=$('#practice');if(pr)pr.onclick=()=>go('sort',wrong.slice());
      return;
    }
    const pid=deck[k],p=P[pid];
    let opts;
    if(lvl()===1){
      opts=Object.keys(CATS).map(c=>`<button class="catbtn" style="--cat:var(--c-${c})" data-c="${c}"><b>${CATS[c].name}</b><small>${CATS[c].d}</small></button>`).join('');
    } else {
      const same=shuffle(PATTERNS.filter(x=>x.cat===p.cat&&x.id!==pid)).slice(0,1);
      const rest=shuffle(PATTERNS.filter(x=>x.id!==pid&&!same.includes(x))).slice(0,3-same.length);
      opts=shuffle([p,...same,...rest]).map(o=>`<button class="catbtn" style="--cat:var(--c-${o.cat})" data-p="${o.id}"><b>${o.de}</b><small>${o.en}</small></button>`).join('');
    }
    main.innerHTML=`<section class="wrap"><div class="crumbs"><button class="linkbtn" data-go="hub">‹ Stationen</button></div>
     <h1 class="h1">Zuordnen</h1>
     <div class="progressbar" aria-label="Fortschritt"><i style="width:${k/n*100}%"></i></div>
     <p class="muted">Karte ${k+1} von ${n}. ${lvl()===1?'Zu welcher Kategorie gehört dieser Trick?':'Welcher Trick ist das genau?'}</p>
     <div class="sort-card"><span class="hand">Beispiel</span>${SORTCARDS[pid]}</div>
     <div class="catbtns" id="answers">${opts}</div>
     <div id="fb" style="margin-top:16px;max-width:640px"></div></section>`;
    $('#answers').onclick=e=>{
      const b=e.target.closest('.catbtn');if(!b||$('#answers').dataset.done)return;
      $('#answers').dataset.done='1';
      const right=lvl()===1?b.dataset.c===p.cat:b.dataset.p===pid;
      b.classList.add(right?'right':'wrong');
      const correctBtn=$('#answers').querySelector(lvl()===1?`[data-c="${p.cat}"]`:`[data-p="${pid}"]`);correctBtn&&correctBtn.classList.add('right');
      if(right){score++;addPoints(10);}else wrong.push(pid);
      run.k=k+1;run.score=score;save();
      discover(pid);setSt(pid,right);
      $('#fb').innerHTML=`<div class="mission"><div class="verdict ${right?'good':'bad'}">${right?'Richtig!':'Nicht ganz.'}</div><p style="margin:.3em 0">${chip(p.cat)} <b>${pname(p)}</b>: ${pexp(p)}</p></div><div class="row" style="margin-top:10px"><button class="btn primary" id="nextCard">${k<n-1?'Nächste Karte':'Auswertung'}</button></div>`;
      $('#nextCard').onclick=()=>{k++;renderCard();window.scrollTo(0,0);};
      $('#nextCard').focus();
    };
  };
  renderCard();
};

/* ============ Lehrpersonen ============ */
VIEWS.teach=()=>{
  main.innerHTML=`<section class="wrap prose">
   <h1 class="h1">Für Lehrpersonen</h1>
   <p class="lead">«Durchschaut!» macht die 20 Dark Patterns von <a href="https://da-pa.ch" target="_blank" rel="noopener">da-pa.ch</a> spielerisch erlebbar. Systematik und Begriffe stammen von der Stiftung für Konsumentenschutz, die fünf Kategorien sind Druckausübung, Erschleichung, Hindernisse, Irreführung und Operativer Zwang.</p>
   <h2>Die drei Stationen und das Sammelalbum</h2>
   <ul>
    <li><b>Trickjagd:</b> Sechs erfundene Apps mit je vier verdächtigen Stellen. Die Lernenden tippen auf verdächtige Elemente und erhalten eine Erklärung mit Schutztipp. In der letzten App (Social-Media-App) stecken wie in vielen echten Fällen mehrere Tricks in einer Stelle. Wer nicht weiterkommt, kann eine App auflösen und neu starten.</li>
    <li><b>Entkommen:</b> Sieben Missionen in zwei Gruppen. «Nein sagen»: Cookies ablehnen, Cookie-Wall «Zahlen oder Zustimmen», Abo kündigen, Newsletter abmelden. «Etwas haben wollen»: neuen AGB begegnen, Gratis-Download, Gewinnspiel. Hier erleben die Lernenden, wie Klick-Müdigkeit, Kakerlakenfalle oder Erzwungene Überprüfung sich anfühlen. Ein Klickzähler macht den Aufwand sichtbar. Die Download-Mission reicht bis in die IT-Sicherheit: Gefälschte Download-Knöpfe, Virenwarnungen und Benachrichtigungs-Abfragen sind Werbung, die auch Schadsoftware verbreiten kann.</li>
    <li><b>Zuordnen:</b> Zehn zufällige Alltagsbeispiele dem richtigen Trick zuordnen.</li>
    <li><b>Sammelalbum:</b> Keine Station, sondern die Sammlung. Im Reiter «Tricks» stehen alle 20 Tricks zum Nachlesen, mit Links zu echten Beispielen in der Hall of Shame. Im Reiter «Abzeichen» sammeln die Lernenden Abzeichen für abgeschlossene Stationen und für entdeckte Tricks.</li>
   </ul>
   <h2>Zwei Niveaus</h2>
   <p><b>Einstieg:</b> einfache Sprache, beim Zuordnen werden die fünf Kategorien gewählt, Tipps und Fehlklicks kosten keine Punkte.<br><b>Profi:</b> Fachbegriffe mit englischen Originalnamen, gefundene Tricks müssen benannt werden, beim Zuordnen wird der genaue Trick bestimmt, Fehlklicks und Tipps kosten Punkte.</p>
   <h2>Lernbilanz statt Überwachung</h2>
   <p>Unter «Mein Fortschritt» erstellen die Lernenden selbst eine Lernbilanz. Sie zeigt, welche Tricks sie erkennen, bei welchen sie noch unsicher sind (aufgelöst, falsch benannt oder falsch zugeordnet) und welchen sie noch nicht begegnet sind. Dazu kommen zwei freiwillige Reflexionsfragen. Punkte, Klickzahlen, Zeiten und Fehlversuche stehen nicht drin. Die Lernenden entscheiden, ob sie die Datei teilen.</p>
   <p>So lässt sich die Bilanz nutzen: Die Liste «noch unsicher» eignet sich für eine kurze Repetition, die Reflexionsantworten für ein Klassengespräch. Eine Bewertung oder Notengebung ist damit nicht gedacht.</p>
   <h2>Datenschutz</h2>
   <p>Keine Anmeldung, keine Namen. Punkte, Abzeichen und Sammelalbum werden nur lokal im Browser des jeweiligen Geräts gespeichert. Auf geteilten Geräten lässt sich der Stand unten zurücksetzen.</p>
   <h2>Hinweise</h2>
   <ul>
    <li>Alle Apps, Marken und Preise im Spiel sind erfunden. Echte, geprüfte Beispiele aus der Schweiz finden sich in der <a href="https://da-pa.ch/hall-of-shame/" target="_blank" rel="noopener">Hall of Shame</a>.</li>
    <li>In der Praxis treten Dark Patterns oft kombiniert auf. Ein Element kann mehreren Kategorien zugeordnet werden, das eignet sich gut als Gesprächsanlass.</li>
   </ul>
   <div class="row" style="margin-top:20px"><button class="btn" id="reset">Fortschritt auf diesem Gerät zurücksetzen</button>${S.level?'<button class="btn primary" data-go="hub">Zu den Stationen</button>':'<button class="btn primary" data-go="start">Zum Start</button>'}</div>
  </section>`;
  $('#reset').onclick=()=>openSheet(`<h3 id="sheetTitle">Wirklich alles zurücksetzen?</h3><p style="margin:0">Punkte, Abzeichen und Sammelalbum auf diesem Gerät werden gelöscht.</p><div class="row"><button class="btn primary" data-yes>Zurücksetzen</button><button class="btn" data-close>Abbrechen</button></div>`,
    e=>{if(e.target.closest('[data-close]'))closeSheet();if(e.target.closest('[data-yes]')){Object.assign(S,{level:null,points:0,disc:[],caught:[],scenes:[],escapes:[],sortBest:0,badges:[],st:{},prog:{},escSt:{},sortRun:null});save();updateHeader();closeSheet();go('start');}});
};

const TKEY='durchschaut-theme';
const effDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
const themeLabel=()=>{$('#themeBtn').textContent=effDark()?'☀️ Hell':'🌙 Dunkel';};
try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t;}catch(e){}
themeLabel();
$('#themeBtn').onclick=()=>{const t=effDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t);}catch(e){}themeLabel();};
/* ============ Spielstand ============ */
let DL=null;
try{window.claude&&window.claude.use&&window.claude.use('downloads').then(d=>{DL=d;}).catch(()=>{});}catch(e){}
function saveFile(name,text,type){
  if(DL){
    DL.save({filename:name,data:text}).then(()=>toast('Gespeichert')).catch(e=>{if(e&&e.code==='declined')return;toast('Speichern geht hier nicht. Nutze den Spielcode.');});
    return;
  }
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();}
  catch(e){toast('Speichern geht hier nicht. Nutze den Spielcode.');}
}
const stateCode=()=>'DS1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
function cleanState(o){
  if(o&&o.app==='durchschaut')o=o.state;
  if(!o||typeof o!=='object')throw new Error('bad');
  const arr=x=>Array.isArray(x)?x:[];
  const ids=new Set(PATTERNS.map(p=>p.id));
  return {level:[1,2].includes(o.level)?o.level:1,
    points:Math.max(0,Math.min(99999,Math.round(Number(o.points)||0))),
    disc:[...new Set(arr(o.disc).filter(x=>ids.has(x)))],
    caught:arr(o.caught).filter(x=>typeof x==='string'&&x.length<20).slice(0,500),
    scenes:[...new Set(arr(o.scenes).filter(x=>Number.isInteger(x)&&x>=0&&x<SCENES.length))],
    escapes:[...new Set(arr(o.escapes).filter(x=>MISSIONS.some(m=>m.id===x)))],
    sortBest:Math.max(0,Math.min(10,Math.round(Number(o.sortBest)||0))),
    badges:[...new Set(arr(o.badges).filter(x=>BADGES.some(b=>b.id===x)))],
    prog:Object.fromEntries(Object.entries(o.prog&&typeof o.prog==='object'?o.prog:{}).filter(([k,v])=>Number(k)<SCENES.length&&Array.isArray(v)).map(([k,v])=>[k,v.filter(x=>typeof x==='string')])),
    st:Object.fromEntries(Object.entries(o.st&&typeof o.st==='object'?o.st:{}).filter(([k,v])=>ids.has(k)&&(v==='ok'||v==='unsure')))};
}
function parseState(txt){
  txt=String(txt||'').trim();
  if(txt.startsWith('DS1:'))txt=decodeURIComponent(escape(atob(txt.slice(4).replace(/\s/g,''))));
  return cleanState(JSON.parse(txt));
}
const lvlName=()=>S.level===2?'Profi':'Einstieg';
const statusOf=p=>(S.st&&S.st[p.id])||(S.disc.includes(p.id)?'ok':'none');
function bilanz(){const g={ok:[],unsure:[],none:[]};PATTERNS.forEach(p=>g[statusOf(p)].push(p));return g;}
const REFLECT=['Wo bist du einem dieser Tricks schon im echten Leben begegnet?','Welcher Trick ärgert dich am meisten, und warum?'];
let reflectDraft=['',''];
function summaryHtml(){
  const g=bilanz();
  const list=ps=>ps.length?ps.map(p=>`${chip(p.cat)} ${p.de}`).join('<br>'):'<span class="muted">keine</span>';
  return `<dl>
   <dt>Niveau</dt><dd>${lvlName()}</dd>
   <dt>Das kann ich erkennen (${g.ok.length})</dt><dd>${list(g.ok)}</dd>
   <dt>Da bin ich noch unsicher (${g.unsure.length})</dt><dd>${list(g.unsure)}</dd>
   <dt>Noch nicht begegnet (${g.none.length})</dt><dd>${list(g.none)}</dd>
  </dl>`;
}
function summaryText(name,answers){
  const g=bilanz(), d=new Date().toLocaleDateString('de-CH');
  const sec=(t,ps)=>[t+' ('+ps.length+'):',...(ps.length?ps.map(p=>'  - '+p.de+' ('+CATS[p.cat].name+')'):['  (keine)']),''];
  const lines=['DURCHSCHAUT! Meine Lernbilanz zu Dark Patterns',d+(name?', '+name:''),'Niveau: '+lvlName(),'',
    ...sec('Das kann ich erkennen',g.ok),...sec('Da bin ich noch unsicher',g.unsure),...sec('Noch nicht begegnet',g.none),
    'Nach Kategorien (erkannt):',...Object.keys(CATS).map(c=>{const ps=PATTERNS.filter(p=>p.cat===c);return '  '+CATS[c].name+': '+ps.filter(p=>statusOf(p)==='ok').length+' von '+ps.length;}),''];
  REFLECT.forEach((q,k)=>{if(answers[k])lines.push(q,'  '+answers[k].replace(/\n/g,'\n  '),'');});
  return lines.join('\n');
}
VIEWS.save=()=>{
  main.innerHTML=`<section class="wrap prose">
   <h1 class="h1">Mein Fortschritt</h1>
   <p class="lead">Dein Fortschritt ist nur in diesem Browser gespeichert. Hier kannst du deine Lernbilanz anschauen, den Spielstand mitnehmen oder neu anfangen.</p>
   <h2>Meine Lernbilanz</h2>
   <p>Damit siehst du, was du schon kannst und was du nochmals anschauen solltest. «Unsicher» heisst: aufgelöst, falsch benannt oder falsch zugeordnet. Wenn du einen Trick später richtig erkennst, wandert er nach oben.</p>
   <div class="summary">${summaryHtml()}</div>
   <p>Wenn du willst, kannst du die Bilanz als Datei speichern und deiner Lehrperson geben. Punkte, Fehlversuche und Zeiten stehen nicht drin.</p>
   ${REFLECT.map((q,k)=>`<label class="field">${q} <span class="muted" style="font-weight:400">(freiwillig)</span><textarea data-r="${k}" rows="2" maxlength="400" style="font-family:inherit;font-size:1rem">${reflectDraft[k].replace(/</g,'&lt;')}</textarea></label>`).join('')}
   <label class="field">Name oder Kürzel <span class="muted" style="font-weight:400">(freiwillig, kommt nur in die Datei)</span><input id="nm" type="text" maxlength="40" autocomplete="off"></label>
   <div class="row"><button class="btn primary" id="dlNw">Lernbilanz als Datei speichern</button><button class="btn" data-go="album">Unsichere Tricks im Sammelalbum anschauen</button></div>
   <h2>Auf ein anderes Gerät mitnehmen</h2>
   <p>Speichere den Spielstand als Datei oder kopiere den Spielcode, zum Beispiel in eine Nachricht an dich selbst. Auf dem anderen Gerät lädst du ihn unten wieder.</p>
   <div class="row"><button class="btn" id="dlJs">Spielstand-Datei speichern</button></div>
   <label class="field">Dein Spielcode<textarea id="code" readonly rows="3">${stateCode()}</textarea></label>
   <div class="row"><button class="btn small" id="cp">Code kopieren</button></div>
   <h2>Spielstand laden</h2>
   <p class="muted">Achtung: Der aktuelle Stand auf diesem Gerät wird dabei ersetzt.</p>
   <label class="field">Spielstand-Datei wählen<input type="file" id="file" accept=".json,application/json,text/plain"></label>
   <label class="field">oder Spielcode einfügen<textarea id="incode" rows="3" placeholder="DS1:..."></textarea></label>
   <div class="row"><button class="btn" id="load">Spielstand laden</button></div>
   <h2>Neu anfangen</h2>
   <p>Löscht Punkte, Abzeichen, Sammelalbum und Lernbilanz auf diesem Gerät. Tipp: Vorher den Spielstand speichern, falls du ihn nochmals brauchst.</p>
   <div class="row"><button class="btn" id="resetMe">Spielstand zurücksetzen</button></div>
  </section>`;
  main.querySelectorAll('[data-r]').forEach(t=>t.oninput=()=>{reflectDraft[Number(t.dataset.r)]=t.value;});
  $('#dlNw').onclick=()=>{const n=$('#nm').value.trim();const slug=n.toLowerCase().replace(/[^a-z0-9äöü]+/g,'-').replace(/^-|-$/g,'');saveFile('durchschaut-lernbilanz'+(slug?'-'+slug:'')+'.txt',summaryText(n,reflectDraft.map(x=>x.trim())),'text/plain');};
  $('#dlJs').onclick=()=>saveFile('durchschaut-spielstand.json',JSON.stringify({app:'durchschaut',v:1,state:S},null,1),'application/json');
  $('#cp').onclick=()=>{const t=$('#code');const sel=()=>{t.focus();t.select();toast('Code markiert. Jetzt kopieren.');};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(()=>toast('Code kopiert')).catch(sel);else sel();};
  const apply=txt=>{
    let st;try{st=parseState(txt);}catch(e){toast('Das ist kein gültiger Spielstand.');return;}
    openSheet(`<h3 id="sheetTitle">Spielstand laden?</h3><p style="margin:0">Gefunden: ${st.points} Punkte, ${st.disc.length} von 20 Tricks, ${st.badges.length} Abzeichen. Der Stand auf diesem Gerät wird ersetzt.</p><div class="row"><button class="btn primary" data-yes>Laden</button><button class="btn" data-close>Abbrechen</button></div>`,
      e=>{if(e.target.closest('[data-close]'))closeSheet();if(e.target.closest('[data-yes]')){Object.assign(S,st);save();updateHeader();closeSheet();toast('Spielstand geladen');go('hub');}});
  };
  $('#load').onclick=()=>{
    const f=$('#file').files&&$('#file').files[0];
    if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.onerror=()=>toast('Datei konnte nicht gelesen werden.');r.readAsText(f);return;}
    if($('#incode').value.trim())apply($('#incode').value);else toast('Wähle eine Datei oder füge einen Code ein.');
  };
  $('#resetMe').onclick=()=>openSheet(`<h3 id="sheetTitle">Wirklich neu anfangen?</h3><p style="margin:0">Punkte, Abzeichen, Sammelalbum und Lernbilanz auf diesem Gerät werden gelöscht. Das lässt sich nicht rückgängig machen, ausser du hast den Spielstand gespeichert.</p><div class="row"><button class="btn primary" data-yes>Zurücksetzen</button><button class="btn" data-close>Abbrechen</button></div>`,
    e=>{if(e.target.closest('[data-close]'))closeSheet();if(e.target.closest('[data-yes]')){Object.assign(S,{level:null,points:0,disc:[],caught:[],scenes:[],escapes:[],sortBest:0,badges:[],st:{},prog:{},escSt:{},sortRun:null});reflectDraft=['',''];save();updateHeader();closeSheet();toast('Zurückgesetzt');go('start');}});
};
